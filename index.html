<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Fela! Music Bar — Social Hub.">
    <meta name="theme-color" content="#ffffff">
    <title>Fela! Music Bar — Social Hub</title>
    <link rel="icon" href="images/fela_favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/appletouch_favicon_fela.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --cream: #f3f0ce;
            --white: #ffffff;
            --red: #ff0403;
            --blue: #0000ff;
            --ink: #171717;
        }

        * { box-sizing: border-box; }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            font-family: "Be Vietnam Pro", sans-serif;
            color: var(--ink);
            background: var(--white);
        }

        body.is-loading { overflow: hidden; }

        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            background: var(--white);
            opacity: 1;
            visibility: visible;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .page-loader.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .page-loader img {
            width: 82px;
            height: auto;
            animation: loader-pulse 1.1s ease-in-out infinite alternate;
        }

        @keyframes loader-pulse {
            from { transform: scale(0.94); opacity: 0.5; }
            to { transform: scale(1); opacity: 1; }
        }

        .site-header-nav {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 10px 20px;
            background: var(--white);
            border-bottom: 2px solid var(--red);
        }

        .nav-container {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            display: inline-flex;
            margin-left: 20px;
        }

        .nav-logo img {
            display: block;
            width: auto;
            height: 45px;
        }

        .hamburger-menu,
        .notification-bell-btn { display: none; }

        main {
            position: relative;
            min-height: 0;
        }

        .totem-stage {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            min-height: 420px;
            overflow: hidden;
            isolation: isolate;
        }

        .totem-stage::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 6%;
            width: min(68vw, 620px);
            aspect-ratio: 3 / 1;
            border-radius: 50%;
            background: rgba(23, 23, 23, 0.08);
            filter: blur(34px);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .signs-marquee {
            position: absolute;
            inset: 50% 0 auto;
            z-index: 0;
            width: 100%;
            height: clamp(82px, 15vw, 150px);
            overflow: hidden;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .signs-track {
            width: max-content;
            height: 100%;
            display: flex;
            align-items: center;
            animation: signs-scroll-right 28s linear infinite;
            will-change: transform;
        }

        .signs-track img {
            display: block;
            width: auto;
            height: 100%;
            max-width: none;
            flex: none;
        }

        @keyframes signs-scroll-right {
            from { transform: translateX(-50%); }
            to { transform: translateX(0); }
        }

        model-viewer {
            width: min(100%, 980px);
            height: 100%;
            min-height: 420px;
            z-index: 1;
            background: transparent;
            pointer-events: none;
            user-select: none;
            --poster-color: transparent;
            --progress-bar-height: 0px;
        }

        .model-status {
            position: absolute;
            left: 50%;
            bottom: 18px;
            z-index: 2;
            margin: 0;
            padding: 7px 12px;
            border: 1px solid var(--red);
            border-radius: 999px;
            color: var(--red);
            background: rgba(255, 255, 255, 0.9);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transform: translateX(-50%);
            transition: opacity 0.35s ease, visibility 0.35s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .model-status.is-hidden {
            opacity: 0;
            visibility: hidden;
        }

        .stage-control {
            position: absolute;
            z-index: 3;
            min-width: 128px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            color: var(--red);
            background: var(--white);
            font: 900 14px/1 "Be Vietnam Pro", sans-serif;
            letter-spacing: 0.08em;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
        }

        .stage-control:hover,
        .stage-control:focus-visible {
            color: var(--white);
            background: var(--red);
            transform: scale(1.04);
            outline: none;
        }

        .control-menu { top: 24px; left: 24px; }
        .control-shirt { top: 24px; left: 50%; transform: translateX(-50%); }
        .control-booking { top: 24px; right: 24px; }
        .control-calendar { bottom: 24px; left: 24px; }

        .control-shirt:hover,
        .control-shirt:focus-visible {
            transform: translateX(-50%) scale(1.04);
        }

        .control-draw {
            right: 24px;
            bottom: 24px;
            background: transparent;
        }

        #music-player-container {
            width: 150px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 6px 10px;
            color: var(--red);
            background: transparent;
        }

        .player-btn {
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 50%;
            color: var(--white);
            background: var(--red);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .player-btn:hover,
        .player-btn:focus-visible {
            transform: scale(1.08);
            outline: none;
        }

        .player-btn svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        #track-info {
            min-width: 0;
            width: 112px;
            overflow: hidden;
        }

        .track-title,
        .track-artist {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-title {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .track-artist {
            margin-top: 2px;
            font-size: 8px;
            font-weight: 500;
        }

        .volume-control {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }

        .site-footer {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
            padding: 25px 40px;
            color: var(--ink);
            background: var(--white);
            font-size: 14px;
            line-height: 1.6;
        }

        .footer-left,
        .footer-right { text-align: left; }

        .footer-right { text-align: right; }
        .site-footer p { margin: 0 0 5px; }

        .site-footer a {
            color: inherit;
            text-decoration: none;
        }

        .site-footer a:hover { text-decoration: underline; }

        @media (max-width: 767px) {
            .site-header-nav { padding: 5px 20px; }
            .nav-logo { margin-left: 9px; }
            .nav-logo img { height: 35px; }
            .totem-stage { min-height: 360px; }

            model-viewer {
                width: 68vw;
                width: 68dvw;
                height: 68%;
                min-height: 0;
            }

            .stage-control {
                min-width: 0;
                min-height: 38px;
                padding: 8px 11px;
                border-radius: 6px;
                font-size: 11px;
            }

            .control-menu { top: 16px; left: 18px; }
            .control-shirt { top: 16px; left: 50%; }
            .control-booking { top: 16px; right: 18px; }
            .control-calendar { bottom: 16px; left: 18px; }

            .control-draw { right: 18px; bottom: 16px; }

            #music-player-container {
                width: 118px;
                min-height: 34px;
                gap: 6px;
                padding: 4px 5px;
            }

            .player-btn {
                width: 28px;
                height: 28px;
                flex-basis: 28px;
            }

            .player-btn svg { width: 15px; height: 15px; }
            #track-info { width: 72px; }
            .track-title { font-size: 9px; }
            .track-artist { display: none; }

            .site-footer {
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding: 16px 15px;
                font-size: 11px;
                line-height: 1.4;
                text-align: center;
            }

            .footer-left,
            .footer-right { text-align: center; }

            .site-footer p { margin-bottom: 2px; }
        }

        @media (max-height: 700px) and (max-width: 767px) {
            .site-footer {
                flex-direction: row;
                justify-content: space-around;
                gap: 10px;
                padding-block: 10px;
            }

            .totem-stage { min-height: 280px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .signs-track { animation-play-state: paused; }
        }
    </style>
</head>
<body class="is-loading">
    <div id="page-loader" class="page-loader" role="status" aria-label="Caricamento del modello 3D">
        <img src="images/f!_logo_rosso.svg" alt="">
    </div>

    <header class="site-header-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo" aria-label="Fela! — Home">
                <img src="images/f!_logo_rosso.svg" alt="Logo Fela! Music Bar Genova">
            </a>
            <div id="music-player-container" aria-label="Radio Fela">
                <audio id="soma-player" src="https://ice1.somafm.com/reggae-256-mp3" preload="none"></audio>
                <button id="play-pause-btn" class="player-btn" type="button" aria-label="Play">
                    <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M6 19h4V5H6v14Zm8-14v14h4V5h-4Z"/></svg>
                </button>
                <div id="track-info">
                    <div class="track-title">Radio Fela</div>
                    <div class="track-artist">Music Selection</div>
                </div>
                <div class="volume-control">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" aria-label="Volume">
                </div>
            </div>
            <button class="hamburger-menu" type="button" aria-label="Apri menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <button id="navbar-notification-btn" class="notification-bell-btn" type="button" aria-label="Attiva notifiche"></button>
        </div>
    </header>

    <main>
        <section class="totem-stage" aria-label="Totem Fela! interattivo in 3D">
            <h1 hidden>Fela! Music Bar — Social Hub</h1>
            <div class="signs-marquee" aria-hidden="true">
                <div class="signs-track">
                    <img src="images/segni_background.svg" alt="">
                    <img src="images/segni_background.svg" alt="">
                </div>
            </div>
            <model-viewer
                id="fela-totem"
                src="images/TOTEMFELASTICO_X_SITO_WEB.glb"
                alt="Totem Fela! tridimensionale"
                auto-rotate
                auto-rotate-delay="0"
                rotation-per-second="22deg"
                interaction-prompt="none"
                shadow-intensity="1"
                shadow-softness="0.9"
                exposure="1"
                environment-image="neutral"
                camera-orbit="0deg 75deg auto"
                min-camera-orbit="auto 35deg auto"
                max-camera-orbit="auto 145deg auto"
                min-field-of-view="20deg"
                max-field-of-view="50deg"
                interpolation-decay="120"
                loading="eager">
                <div slot="progress-bar" hidden></div>
            </model-viewer>
            <p id="model-status" class="model-status" role="status">Caricamento totem 3D…</p>

            <a class="stage-control control-menu" href="menu.html">Menu</a>
            <a class="stage-control control-shirt" href="f-shirt.html">F!-Shirt</a>
            <a class="stage-control control-booking" href="prenota.html">Prenotazioni</a>
            <a class="stage-control control-calendar" href="eventi.html" aria-label="Calendario eventi">
                <span>Calendario</span>
            </a>

            <a class="stage-control control-draw" href="lascia-il-tuo-segno.html">
                <span>Lascia il tuo segno</span>
            </a>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-left">
            <p><strong>Fela!<br>Music Bar - Social Hub</strong></p>
            <a href="https://maps.app.goo.gl/zhNrFjCBpWnWwXuP9" target="_blank" rel="noopener noreferrer">
                <p>Via di S. Cosimo, 6r, 16128 Genova GE</p>
            </a>
        </div>
        <div class="footer-right">
            <p>
                <strong>Orari:</strong><br>
                Mer-Gio: 18:00 - 01:00<br>
                Ven-Sab: 18:00 - 02:00<br>
                Dom: 17:00 - 00:00<br>
                Lun-Mar: FELAKIUDI
            </p>
        </div>
    </footer>

    <script>
        const totem = document.querySelector('#fela-totem');
        const status = document.querySelector('#model-status');
        const loader = document.querySelector('#page-loader');

        function closeLoader() {
            loader.classList.add('is-hidden');
            document.body.classList.remove('is-loading');
        }

        totem.addEventListener('load', () => {
            status.classList.add('is-hidden');
            totem.setAttribute('camera-orbit', '0deg 75deg auto');
            if (typeof totem.jumpCameraToGoal === 'function') totem.jumpCameraToGoal();
            requestAnimationFrame(() => requestAnimationFrame(closeLoader));
        });

        totem.addEventListener('error', () => {
            status.textContent = 'Totem 3D non disponibile';
            closeLoader();
        });

        if (totem.loaded) {
            totem.setAttribute('camera-orbit', '0deg 75deg auto');
            if (typeof totem.jumpCameraToGoal === 'function') totem.jumpCameraToGoal();
            closeLoader();
        }
    </script>
    <script src="js/music-player.js" defer></script>
</body>
</html>
